# OUTIL PONCTUEL — à supprimer après usage.
name: Confirmer un compte CRM (ponctuel)
on: workflow_dispatch
jobs:
  confirmer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        working-directory: sync-devis
        run: npm install --omit=optional
      - name: Confirmer
        working-directory: sync-devis
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node confirmer-compte.mjs
