# Migration ponctuelle du statut « A appeler » -> « A contacter » dans le CRM.
#
# ⚠️ TEMPORAIRE : ce workflow et sync-devis/migrer-a-contacter.mjs sont à
#    supprimer une fois la migration vérifiée.
#
# Uniquement déclenchable à la main (pas de cron, pas de déclenchement au push).

name: Migration statut « A contacter »

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = compter sans rien écrire"
        required: false
        default: '1'
      annuler:
        description: "1 = revenir en arrière (A contacter -> A appeler)"
        required: false
        default: '0'

concurrency:
  group: migration-a-contacter
  cancel-in-progress: false

jobs:
  migrer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sync-devis   # le script y trouve ses dépendances
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'        # supabase-js exige un WebSocket natif (absent en Node 20)

      - name: Installer les dépendances
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Migrer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # if/then et pas « [ ] && … » : sous bash -e, un test faux ferait
          # échouer l'étape au lieu de simplement ne pas ajouter l'option.
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "1" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.annuler }}" = "1" ]; then ARGS="$ARGS --annuler"; fi
          echo "node migrer-a-contacter.mjs $ARGS"
          node migrer-a-contacter.mjs $ARGS

      - name: Conserver la sauvegarde
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-avant-migration
          path: sync-devis/sauvegarde-migration/
          if-no-files-found: ignore
          retention-days: 90
