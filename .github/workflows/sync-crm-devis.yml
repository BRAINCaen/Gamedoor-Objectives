# Synchro des DEVIS -> CRM Supabase (crmprocaen.netlify.app).
# Source : le Hub GAMEDOOR·41 depuis la bascule du 02/11/2026 (pont signé /api/pont/crm-devis,
# voir docs/pont-crm-devis.md du dépôt GAMEDOOR-HUB) ; 4escape avant (input « source »).
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   HUB_PONT_CRM_CLE_PRIVEE             clé privée Ed25519 du robot (le Hub n'a que la clé publique)
#   SUPABASE_URL, SUPABASE_SERVICE_KEY  base du CRM
#   FE_USER, FE_PASS (+ FE_BASE, QUOTES_PATH)   seulement pour source=4escape

name: Synchro devis Hub -> CRM

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = analyser sans rien écrire (test)"
        required: false
        default: '0'
      source:
        description: "hub (défaut) ou 4escape (ancienne source)"
        required: false
        default: 'hub'
  repository_dispatch:
    types: [sync-devis]          # déclenché par le bouton du CRM (via Netlify)
  schedule:
    - cron: '20 4 * * *'         # ~06:20 Paris (été) — filet quotidien

concurrency:
  group: sync-crm-devis
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SYNC_DEVIS_SOURCE: ${{ github.event.inputs.source || 'hub' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'  # 22+ requis : supabase-js exige un WebSocket natif

      - name: Install deps
        working-directory: sync-devis
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Tests hors ligne
        working-directory: sync-devis
        run: node tests/test-hub.mjs

      - name: Install Chromium (source 4escape seulement)
        if: env.SYNC_DEVIS_SOURCE == '4escape'
        working-directory: sync-devis
        run: npx playwright install --with-deps chromium

      - name: Run sync
        working-directory: sync-devis
        env:
          HUB_PONT_CRM_CLE_PRIVEE: ${{ secrets.HUB_PONT_CRM_CLE_PRIVEE }}
          FE_BASE:              ${{ secrets.FE_BASE }}
          FE_USER:              ${{ secrets.FE_USER }}
          FE_PASS:              ${{ secrets.FE_PASS }}
          QUOTES_PATH:          ${{ secrets.QUOTES_PATH }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SYNC_SOURCE: ${{ github.event_name == 'schedule' && 'cron' || (github.event_name == 'repository_dispatch' && 'bouton' || 'manuel') }}
        run: node sync.mjs ${{ github.event.inputs.dry_run == '1' && '--dry-run' || '' }}

      - name: Upload debug on failure
        if: failure() && env.SYNC_DEVIS_SOURCE == '4escape'
        uses: actions/upload-artifact@v4
        with:
          name: debug-sync-devis
          path: sync-devis/debug/
          if-no-files-found: ignore
          retention-days: 7
